<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Greeting</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body {
        font-family: "Poppins", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        animation: bgAnimation 14s ease-in-out infinite;
    }

    @keyframes bgAnimation {
        0%   { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
        25%  { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        50%  { background: linear-gradient(135deg, #f6d365, #fda085); }
        75%  { background: linear-gradient(135deg, #96e6a1, #d4fc79); }
        100% { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
    }

    
    .heart-container {
        position: relative;
        width: 580px;
        height: 530px;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: 0.4s ease;
    }

    .heart {
        position: absolute;
        width: 580px;
        height: 530px;
        background: #ff4d6d;
        transform: rotate(-45deg);
        border-radius: 60% 60% 0 0;
        transition: 0.4s ease;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 580px;
        height: 530px;
        background: #ff4d6d;
        border-radius: 60% 60% 0 0;
    }

    .heart::before {
        top: -280px;
        left: 0;
    }

    .heart::after {
        left: 280px;
        top: 0;
    }

    
    .content-box {
        position: relative;
        width: 70%;
        text-align: center;
        z-index: 10;
        color: white;
    }

    .content-box h2 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    input, select {
        width: 90%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 17px;
        text-align: center;
    }

    button {
        margin-top: 15px;
        padding: 10px 25px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        background: white;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s ease;
    }

    button:hover {
        transform: scale(1.08);
        background: #ffe1ee;
    }

    #message {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        min-height: 30px;
    }

    .active {
        transform: scale(1.1) translateY(-10px);
    }

</style>
</head>

<body>

<div class="heart-container" id="heartClick">
    <div class="heart" id="heartShape"></div>

    <div class="content-box">
        <h2>❤️ Personalized Greeting ❤️</h2>

        <input type="text" id="username" placeholder="Enter your name">

        <select id="mood">
            <option value="">How are you feeling?</option>
            <option value="happy">Happy 😊</option>
            <option value="sad">Sad 😢</option>
            <option value="excited">Excited 🤩</option>
            <option value="tired">Tired 😴</option>
        </select>

        <button onclick="showMessage()">Show Greeting</button>

        <div id="message"></div>
    </div>
</div>

<script>
    const heartBox = document.getElementById("heartClick");
    const heartShape = document.getElementById("heartShape");

    const colors = ["#ff4d6d", "#ff6b81", "#ff2e63", "#ff8fa3", "#ff5d8f"];

    heartBox.addEventListener("click", () => {
        heartBox.classList.toggle("active");
        let randomColor = colors[Math.floor(Math.random() * colors.length)];
        heartShape.style.background = randomColor;
    });

    function showMessage() {
        let name = document.getElementById("username").value;
        let mood = document.getElementById("mood").value;
        let msg = document.getElementById("message");

        if (!name || !mood) {
            msg.innerHTML = "⚠️ Please enter your name & select your mood!";
            return;
        }

        let hour = new Date().getHours();
        let greeting = hour < 12 ? "Good Morning" :
                       hour < 18 ? "Good Afternoon" :
                                   "Good Evening";

        let moodMessage = {
            happy: "Great to see you smiling 😊",
            sad: "Things will get better soon 💛",
            excited: "Your energy is amazing 🔥",
            tired: "Take some rest, you deserve it 😴"
        };

        msg.innerHTML = `${greeting}, <b>${name}</b>! <br>${moodMessage[mood]}`;
    }
</script>

</body>
</html>
